# ==============================================================================
# 1. GENERAL & QUALITY OF LIFE
# ==============================================================================
# Enable mouse support (click panes, resize borders, scroll history)
set -g mouse on

# Increase scrollback buffer size
set -g history-limit 50000

# Enable 256-color and true-color (RGB) support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start window and pane numbering at 1 instead of 0 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Eliminate delay when pressing Escape (crucial for Vim/Neovim users)
set -sg escape-time 0

# Focus events enabled for terminals that support them
set -g focus-events on

# ==============================================================================
# 2. KEYBINDINGS
# ==============================================================================
# Remap prefix from 'Ctrl+b' to 'Ctrl+a' (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config file easily with Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# More intuitive pane splitting (opens in the current working directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Open new windows in the current working directory
bind c new-window -c "#{pane_current_path}"

# Switch panes using Alt + Arrow keys without needing the prefix
bind C-h select-pane -L
bind C-l select-pane -R
bind C-k select-pane -U
bind C-j select-pane -D

# ==============================================================================
# 3. COPY MODE (VI-STYLE)
# ==============================================================================
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Enable OSC 52 clipboard synchronization
set -g set-clipboard on

# Allow programs inside tmux (like Neovim) to pass clipboard sequences through
set -g allow-passthrough on

# Tell tmux your terminal supports clipboard features
set -as terminal-features ',xterm*:clipboard'

# ==============================================================================
# 4. MINIMAL STATUS BAR
# ==============================================================================
set -g status-position bottom
set -g status-style 'bg=#1e1e1e fg=#d4d4d4'
set -g status-left '#[fg=#1e1e1e,bg=#9cdcfe,bold] #S #[default] '
set -g status-right '#[fg=#d4d4d4] %Y-%m-%d %H:%M '
set -g status-left-length 30

# Active vs. inactive window tabs
setw -g window-status-current-style 'fg=#1e1e1e,bg=#608b4e,bold'
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-format ' #I:#W#F '
