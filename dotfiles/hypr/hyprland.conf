# FREQUENT APPS
bind=$mainMod,o,submap,(1)Signal, (2)Transmission, (3)OBS, (4) Virt Manager

submap=(1)Signal, (2)Transmission, (3)OBS, (4) Virt Manager
bind=,1,exec,signal-desktop
bind=,2,exec,transmission-qt
bind=,3,exec,obs
bind=,4,exec,virt-manager
